name: Bug Report
description: Report a reproducible defect using the QA workflow.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Give the defect a concise title and impact statement.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Django, browser, commit SHA
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Evidence
      description: Include sanitized logs, request IDs, screenshots, or failing test output.
      render: shell
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Define the regression test or observable condition that proves the fix.