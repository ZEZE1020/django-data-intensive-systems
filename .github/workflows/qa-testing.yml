name: QA Testing Suite
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: 'Run full load test suite'
        required: false
        default: 'false'
        type: boolean

jobs:
  api-testing:
    name: API & Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_data_intensive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --all-extras --dev
          
      - name: Run API-specific tests
        env:
          DB_HOST: localhost
          DB_NAME: django_data_intensive
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-12345
        run: |
          uv run python manage.py migrate
          uv run pytest -m "api or integration" -v

  ui-visual-regression:
    name: UI Visual Regression & Manual Test Case Validation
    runs-on: ubuntu-latest
    needs: api-testing
    if: github.event.inputs.run_load_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run Locust load tests in headless mode
        run: |
          uv run locust -f scripts/load_test.py --headless -u 100 -r 10 --run-time 5m --host http://localhost:8000

  defect-tracking-integration:
    name: Sync Test Results to Issue Tracker
    runs-on: ubuntu-latest
    if: failure()
    needs: [api-testing, ui-visual-regression]
    steps:
      - name: Create Jira issue for test failures
        uses: atlassian/gajira-create@v3
        with:
          project: "TEST"
          issueType: "Bug"
          summary: "CI/CD Test failures detected in ${{ github.sha }}"
          description: "Automated test suite detected failures in the latest commit. Please investigate."
          fields: '{"components": [{"name": "QA Automation"}], "priority": {"name": "High"}}'
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_URL: ${{ secrets.JIRA_URL }}